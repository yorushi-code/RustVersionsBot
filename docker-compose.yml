services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-versionsbot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-versionsbot}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:543
      # Пул соединений (аналог SetMaxOpenConns / SetConnMaxLifetime в Go)
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      PAGE_SIZE: ${PAGE_SIZE:-10}
      # Дополнительные dev-admin IDs через запятую (6820351323 вшит в код)
      DEV_ADMIN_IDS: ${DEV_ADMIN_IDS:-}
      RUST_LOG: ${LOG_LEVEL:-info}

volumes:
  postgres_data:
    driver: local